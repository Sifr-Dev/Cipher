name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts used by the text-engine tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core fonts-dejavu-extra

      - name: Install Zig 0.17.1 (official tarball, sha256 verified)
        run: |
          curl -fsSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: zig build test (perf gate off on shared runners; GPU/flac tests skip honestly without Vulkan/CLIs)
        env:
          CIPHER_SKIP_PERF_GATE: "1"
        run: zig build test

      - name: Debug build
        run: zig build

      - name: ReleaseSafe build
        run: zig build -Doptimize=ReleaseSafe

      - name: ReleaseFast build
        run: zig build -Doptimize=ReleaseFast

  software-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install software Vulkan and test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools vulkan-validationlayers fonts-liberation fonts-dejavu-core fonts-dejavu-extra

      - name: Install Zig 0.17.1 (official tarball, sha256 verified)
        run: |
          curl -fsSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Run rendering and framework tests on lavapipe
        env:
          CIPHER_SKIP_PERF_GATE: "1"
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          zig build test
